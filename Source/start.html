*{box-sizing:border-box}
html{height:100%;overflow:hidden;background:linear-gradient(160deg,#447c97 0%,#7eafc4 39%,#a1a6cc 65%,#283779 100%);color-scheme:dark;--u:min(calc(100vw / 375),calc(100dvh / 560))}
body{display:flow-root;margin:0;width:100%;height:100dvh;overflow:hidden;isolation:isolate;position:relative;color:#fff;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,#447c97 0%,#7eafc4 39%,#a1a6cc 65%,#283779 100%)}

.grid{width:calc(348 * var(--u));margin:calc(17 * var(--u)) auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:calc(92 * var(--u));align-content:start}
a{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:0;text-decoration:none;color:white;font-size:calc(12 * var(--u));font-weight:600;line-height:1.18;white-space:nowrap;text-shadow:0 1px 2px #33496866;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:2px solid #fff9;outline-offset:2px;border-radius:calc(13 * var(--u))}
a:active .icon{filter:brightness(.8);transform:scale(.95)}
.icon{width:calc(56 * var(--u));height:calc(56 * var(--u));border-radius:calc(12 * var(--u));margin:0 0 calc(6 * var(--u));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 2px #16365b20,inset 0 1px 0 #ffffff28;font-size:calc(35 * var(--u));font-weight:700;text-shadow:none}
svg{width:61%;height:61%;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.youtube{background:#ff2344}.tiktok{background:#08090e;text-shadow:-2px -1px #25f4ee,2px 2px #fe2c55}.instagram{background:radial-gradient(circle at 25% 110%,#ffcf64,transparent 65%),linear-gradient(135deg,#6744e8,#d4349b,#ef6146)}.facebook{background:#1877f2;font-family:Arial;font-size:calc(52 * var(--u));padding-top:calc(8 * var(--u))}.x{background:#080a10;font-weight:400}.reddit{background:#ff5724}.twitch{background:#9146ff}.soundcloud{background:linear-gradient(#ff941f,#ff551f)}.spotify{background:#1ed760;color:#092918}
.ptg{position:relative;background:linear-gradient(#64e678,#18bf4c)}.ptg svg{width:85%;height:85%;stroke:none}.ptg-label{font-size:calc(10.5 * var(--u))}.badge{position:absolute;top:calc(-7 * var(--u));right:calc(-7 * var(--u));background:#ff3b30;color:white;border-radius:999px;min-width:calc(22 * var(--u));height:calc(22 * var(--u));padding:calc(3 * var(--u)) calc(5 * var(--u));font:700 calc(13 * var(--u))/1.2 Arial;text-align:center}.badge[hidden]{display:none}.gmail{background:#fff}.gmail svg{width:76%;height:76%}
